<ion-content class="ion-padding">
  
  <div class="stars"></div>

  
  <div class="register-wrapper">
    <div class="glass-card">
      
     
      <div class="orbital-ring"></div>

      
      <div style="text-align: center; margin-bottom: 1.5rem; position: relative; z-index: 10;">
        <div style="display: inline-block; padding: 0.75rem; border-radius: 1rem; background: linear-gradient(135deg, rgba(76, 29, 149, 0.5), rgba(30, 58, 138, 0.5)); border: 1px solid rgba(168, 85, 247, 0.3); margin-bottom: 0.75rem; box-shadow: 0 10px 15px -3px rgba(88, 28, 135, 0.4);">
          <i class="fa-solid fa-meteor" style="font-size: 1.875rem; color: #38bdf8;"></i>
        </div>
        <h1 class="nova-title">NOVA</h1>
        <p class="nova-subtitle">Inteligencia Artificial</p>
      </div>

      
      <form (ngSubmit)="onLogin()" class="space-form">
        
       
        <div>
          <label for="correoInput">Correo Electrónico</label>
          <div class="input-icon-wrapper">
            <span class="input-icon-left">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input id="correoInput" type="email" [(ngModel)]="correo" name="correo" required placeholder="usuario@nova-ia.space" class="input-with-icon">
          </div>
        </div>

       
        <div>
          <label for="passwordInput">Contraseña Estelar</label>
          <div class="input-icon-wrapper">
            <span class="input-icon-left">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input id="passwordInput" [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required placeholder="••••••••••••" class="input-with-icon input-with-right-icon">
            <button type="button" (click)="togglePassword()" class="input-icon-right">
              <i [class]="mostrarPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
        </div>

       
        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" class="custom-checkbox">
            <span>Recordar sesión</span>
          </label>
          <a href="#" (click)="mostrarAlertaRecuperacion($event)" class="forgot-link">¿Olvidaste tu clave?</a>
        </div>

       
        <button id="btn" type="submit" [disabled]="cargando" class="btn-space">
          <span>{{ cargando ? 'Conectando...' : 'Comenzar ➔' }}</span>
        </button>

       
        <div class="footer-register-link">
          ¿Nuevo en el sistema estelar? 
          <button type="button" (click)="irRegistro()" class="register-highlight" style="background: none; border: none; padding: 0; font: inherit; cursor: pointer;">
            Crear cuenta
          </button>
        </div>

       
        <pre class="response-box">{{ mensajeEstado }}</pre>

      </form>
    </div>
  </div>
</ion-content>

<ion-content class="ion-padding">
 
  <div class="stars"></div>

 
  <div class="register-wrapper">
    <div class="glass-card">
      
     
      <div class="orbital-ring"></div>

  
      <div style="text-align: center; margin-bottom: 1.5rem; position: relative; z-index: 10;">
        <div style="display: inline-block; padding: 0.75rem; border-radius: 1rem; background: linear-gradient(135deg, rgba(76, 29, 149, 0.5), rgba(30, 58, 138, 0.5)); border: 1px solid rgba(168, 85, 247, 0.3); margin-bottom: 0.75rem; box-shadow: 0 10px 15px -3px rgba(88, 28, 135, 0.4);">
          <i class="fa-solid fa-meteor" style="font-size: 1.875rem; color: #38bdf8;"></i>
        </div>
        <h1 class="nova-title">Registro · NOVA</h1>
        <p class="nova-subtitle">Inteligencia Artificial</p>
      </div>

      
      <form (ngSubmit)="onRegistrar()" class="space-form">
        
        <div>
          <label for="nombre">Nombre</label>
          <input id="nombre" [(ngModel)]="nombre" name="nombre" required placeholder="Tu nombre">
        </div>

        <div>
          <label for="apellido">Apellido</label>
          <input id="apellido" [(ngModel)]="apellido" name="apellido" required placeholder="Tus apellidos">
        </div>

        <div>
          <label for="usuario">Nombre de Usuario</label>
          <input id="usuario" [(ngModel)]="usuario" name="usuario" required placeholder="Tu apodo o usuario">
        </div>

        <div>
          <label for="correo">Correo Electrónico</label>
          <input id="correo" [(ngModel)]="correo" name="correo" type="email" required placeholder="usuario@correo.com">
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input id="password" [(ngModel)]="password" name="password" type="password" required placeholder="••••••••••••">
        </div>

        <div>
          <label for="edad">Edad</label>
          <input id="edad" [(ngModel)]="edad" name="edad" type="number" min="1" max="120" required placeholder="Tu edad">
        </div>

        <div>
          <label for="musica">Música <small style="color: rgba(216, 180, 254, 0.7); font-weight: normal;">(separada por comas)</small></label>
          <input type="text" [(ngModel)]="musicaInput" name="musica" placeholder="¿Qué tipo de música te gusta?" />
        </div>

        <div>
          <label for="series">Series <small style="color: rgba(216, 180, 254, 0.7); font-weight: normal;">(separadas por comas)</small></label>
         <input type="text" [(ngModel)]="seriesInput" name="series" placeholder="¿Qué series ves?" />
        </div>

        <div>
          <label for="ocupacion">Ocupación</label>
          <input id="ocupacion" [(ngModel)]="ocupacion" name="ocupacion" placeholder="Estudiante, Desarrollador...">
        </div>

        
        <button id="btn" type="submit" [disabled]="cargando" class="btn-space">
          <span>{{ cargando ? 'Enviando...' : 'Registrarme' }}</span>
          <i class="fa-solid fa-arrow-right" style="font-size: 0.75rem;"></i>
        </button>

        
        <button id="irLogin" routerLink="/login" class="btn-outline-space" type="button">
          Iniciar sesión
        </button>


        <pre class="response-box">{{ mensajeEstado }}</pre>

      </form>
    </div>
  </div>
</ion-content>

<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <div class="chat-header glass-card">
      <button class="btn-back" (click)="regresarMenu()">
        <i class="fa-solid fa-arrow-left"></i> Menú
      </button>
      <div class="chat-title-info">
        <h2>NOVA · Chat IA</h2>
        <span class="status-badge">Nivel: {{ nivelIngles }}</span>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding chat-content">
  
  <canvas #starsCanvas class="stars-canvas"></canvas>

  <div class="chat-container">
   
    <div class="messages-wrapper">
      @for (msg of mensajes; track msg) {
        <div [ngClass]="{'msg-user': msg.remitente === 'user', 'msg-nova': msg.remitente === 'nova'}" class="message-bubble">
          <div class="message-content">
            <p style="white-space: pre-line;">{{ msg.texto }}</p>
            <span class="message-time">{{ msg.hora }}</span>
          </div>
        </div>
      }

      @if (cargando) {
        <div class="message-bubble msg-nova">
          <div class="message-content typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      }
    </div>
  </div>
</ion-content>


<ion-footer class="ion-no-border transparent-footer">
  <div class="chat-input-area glass-card">
    <input 
      type="text" 
      [(ngModel)]="mensajeTexto" 
      (keyup.enter)="enviarMensaje()" 
      placeholder="Escribe una pregunta para NOVA..." 
      [disabled]="cargando"
    />
    <button (click)="enviarMensaje()" [disabled]="cargando || !mensajeTexto.trim()" class="btn-send">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</ion-footer>
